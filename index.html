<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nehuba</title>
    <style>
      html,
      body,
      #neuroglancer-container {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* .neuroglancer-side-panel-column
      {
        display: none!important;
      } */
    </style>
  </head>
  <body>
    <div id="neuroglancer-container"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      const scale = 1
      const backgrd = [1, 1, 1, 1]
      const rmPsp = {"color":[1,1,1,1],"mode":"=="}
      const centerTranslate  = null
      const drawSubstrates = {"color":[0,0,0.5,0.15], "translate": centerTranslate}
      const drawZoomLevels = {"cutOff":200000 * scale,"color":[0.5,0,0,0.15], min: 200000 * scale * 10 }
      const PERSPECTIVE_ZOOM_FUDGE_FACTOR = 82.842712474619

      const config = {
    "configName": "",
    "globals": {
      "hideNullImageValues": true,
      "useNehubaLayout": true,
      "useNehubaMeshLayer": true,
      "rightClickWithCtrlGlobal": false,
      "zoomWithoutCtrlGlobal": false,
      "useCustomSegmentColors": true
    },
    "zoomWithoutCtrl": true,
    "hideNeuroglancerUI": true,
    "rightClickWithCtrl": true,
    "rotateAtViewCentre": true,
    "enableMeshLoadingControl": true,
    "zoomAtViewCentre": true,
    // "restrictUserNavigation": true,
    "dataset": {
      "imageBackground": backgrd,
      "initialNgState": {
        "showDefaultAnnotations": false,
        "layers": {},
        "navigation": {
          "zoomFactor": 350000 * scale,
          pose: {
            position: {
              voxelSize: [1, 1, 1]
            }
          }
        },
        "perspectiveOrientation": [
          0.3140767216682434,
          -0.7418519854545593,
          0.4988985061645508,
          -0.3195493221282959
        ],
        "perspectiveZoom": 1922235.5293810747 * scale
      }
    },
    "layout": {
      "useNehubaPerspective": {
        "perspectiveSlicesBackground": backgrd,
        "removePerspectiveSlicesBackground": rmPsp,
        "perspectiveBackground": backgrd,
        "fixedZoomPerspectiveSlices": {
          "sliceViewportWidth": 300,
          "sliceViewportHeight": 300,
          "sliceZoom": 563818.3562426177 * scale,
          "sliceViewportSizeMultiplier": 2
        },
        "mesh": {
          "backFaceColor": backgrd,
          "removeBasedOnNavigation": true,
          "flipRemovedOctant": true,
        },
        "centerToOrigin": true,
        "drawSubstrates": drawSubstrates,
        "drawZoomLevels": drawZoomLevels,
        "restrictZoomLevel": {
          "minZoom": 1200000 * scale * PERSPECTIVE_ZOOM_FUDGE_FACTOR,
          "maxZoom": 3500000 * scale * PERSPECTIVE_ZOOM_FUDGE_FACTOR
        }
      }
    }
  }
      const spec = {
        source: "precomputed://https://neuroglancer.humanbrainproject.eu/precomputed/BigBrainRelease.2015/8bit",
        transform: [[1.0, 0.0, 0.0, -70677184.0], [0.0, 1.0, 0.0, -70010000.0], [0.0, 0.0, 1.0, -58788284.0], [0.0, 0.0, 0.0, 1.0]]
      }
      const spec2 = {
        source: "precompmesh://https://neuroglancer.humanbrainproject.eu/precomputed/BigBrainRelease.2015/classif_mesh",
        transform: [[1, 0, 0, -70666600], [0, 1, 0, -72910000], [0, 0, 1, -58777700], [0, 0, 0, 1]]
      }
      const viewer = export_nehuba.createNehubaViewer()
      viewer.addLayer(spec, "foo")
      viewer.addLayer(spec2, "foo2")
    </script>
  </body>
</html>
